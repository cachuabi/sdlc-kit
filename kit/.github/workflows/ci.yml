# The quality gate that decides whether a pull request may merge.
# Make "check" a required status check in branch protection for main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Quality gate
        run: bash scripts/check.sh
