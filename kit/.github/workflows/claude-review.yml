# Automatic AI review when a pull request is opened or marked ready (not on every push, to
# keep cost predictable). Ask for another pass by commenting "@claude review again".
# Fork PRs are skipped: they get no secrets and their content is untrusted.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            Review this pull request following .claude/commands/review-diff.md, against base
            origin/${{ github.event.pull_request.base.ref }}. Do not modify files.
            - Check correctness (including security), the conventions in .claude/sdlc/RULES.md,
              and whether tests would fail if the business logic broke.
            - Before reporting, re-read the cited code and drop any finding you cannot confirm.
            - Post confirmed blocker/major issues as inline comments, then one summary comment
              with the severity table. If nothing survives, say so and list what you checked.
            - Check the PR description lists acceptance criteria and check.sh evidence.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
