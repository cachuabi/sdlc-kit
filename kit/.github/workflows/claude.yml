# Claude implements work when asked: label an issue "claude", or mention @claude in an
# issue/PR comment. It works on a claude/... branch and never merges; CI and a human review
# decide what lands. Only users with write access can trigger it (the action's default).
#
# Setup: run `/install-github-app` in Claude Code, or add the ANTHROPIC_API_KEY secret
# (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`) to the repository.
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installs deps so the Stop hook can run scripts/check.sh before Claude finishes.
      - uses: ./.github/actions/setup-project

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          plugins: superpowers@claude-plugins-official
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(./scripts/check.sh:*),Bash(bash scripts/check.sh:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --append-system-prompt "Follow .claude/sdlc/RULES.md. Work on a branch, prove the result with ./scripts/check.sh, never merge. If the request is ambiguous, ask in a comment and stop."
